name: "Webtop XFCE (Русский)"
version: "1.0.2"
slug: "webtop_ru"
description: "Рабочий стол Ubuntu XFCE с русским языком"
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: manual
webui: "https://[HOST]:[PORT:3001]"
ports:
  3000/tcp: 3000
  3001/tcp: 3001
ports_description:
  3000/tcp: "Web UI (HTTP)"
  3001/tcp: "Web UI (HTTPS)"
map:
  - share:rw
  - media:rw
options:
  PUID: 1000
  PGID: 1000
  TZ: "Europe/Chisinau"
  LC_ALL: "ru_RU.UTF-8"
  KEYBOARD: "ru-ru-qwerty"
  CUSTOM_USER: ""
  PASSWORD: ""
schema:
  PUID: int
  PGID: int
  TZ: str
  LC_ALL: str
  KEYBOARD: str
  CUSTOM_USER: str?
  PASSWORD: password?
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
devices:
  - /dev/dri
shm_size: "1g"
