name: "Webtop XFCE (Русский)"
version: "1.1.1"
slug: "webtop_ru"
description: "Рабочий стол Ubuntu XFCE с русским языком и полным доступом к дискам"
init: false
apparmor: false
udev: true
host_dbus: true
audio: true
video: true
tmpfs: true
arch:
  - amd64
  - aarch64
startup: services
boot: manual
webui: "https://[HOST]:[PORT:3001]"
ports:
  3000/tcp: 3000
  3001/tcp: 3001
ports_description:
  3000/tcp: "Web UI (HTTP)"
  3001/tcp: "Web UI (HTTPS)"
environment:
  START_DOCKER: "false"
  TITLE: "Ubuntu XFCE (Русский)"
  LC_ALL: "ru_RU.UTF-8"
  LANG: "ru_RU.UTF-8"
map:
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - backup:rw
  - ssl:rw
options:
  PUID: 1000
  PGID: 1000
  TZ: "Europe/Chisinau"
  LC_ALL: "ru_RU.UTF-8"
  KEYBOARD: "ru-ru-qwerty"
  DRINODE: "/dev/dri/renderD128"
  CUSTOM_USER: ""
  PASSWORD: ""
schema:
  PUID: int
  PGID: int
  TZ: str
  LC_ALL: str
  KEYBOARD: str
  DRINODE: str?
  CUSTOM_USER: str?
  PASSWORD: password?
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
  - SYS_PTRACE
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/renderD128
  - /dev/fuse
shm_size: "1g"
