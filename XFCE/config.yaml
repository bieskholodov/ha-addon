name: "Webtop XFCE (Русский)"
version: "1.1.7"
slug: "webtop_ru"
description: "Рабочий стол Ubuntu XFCE с русским языком и полным доступом к дискам"
init: false
apparmor: false
audio: true
video: true
tmpfs: true
ingress: true
ingress_port: 3000
panel_icon: "mdi:monitor"
panel_title: "Рабочий стол"
arch:
  - amd64
  - aarch64
startup: services
boot: manual
ports:
  3000/tcp: null
  3001/tcp: 3001
ports_description:
  3000/tcp: "Web UI (HTTP - для Ingress)"
  3001/tcp: "Web UI (HTTPS - прямой доступ)"
environment:
  START_DOCKER: "false"
  TITLE: "Ubuntu XFCE (Русский)"
  LC_ALL: "ru_RU.UTF-8"
  LANG: "ru_RU.UTF-8"
map:
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - backup:rw
  - ssl:rw
options:
  PUID: 1000
  PGID: 1000
  TZ: "Europe/Chisinau"
  LC_ALL: "ru_RU.UTF-8"
  KEYBOARD: "ru-ru-qwerty"
  DRINODE: "/dev/dri/renderD128"
  CUSTOM_USER: ""
  PASSWORD: ""
schema:
  PUID: int
  PGID: int
  TZ: str
  LC_ALL: str
  KEYBOARD: str
  DRINODE: str?
  CUSTOM_USER: str?
  PASSWORD: password?
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
  - SYS_PTRACE
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/renderD128
shm_size: "1g"
