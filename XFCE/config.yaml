name: "Webtop XFCE (Русский)"
version: "1.1.0"
slug: "webtop_ru"
description: "Рабочий стол Ubuntu XFCE с русским языком и доступом к дискам"
init: false
apparmor: false
udev: true
host_dbus: true
audio: true
video: true
tmpfs: true
arch:
  - amd64
  - aarch64
startup: services
boot: manual
webui: "https://[HOST]:[PORT:3001]"
ports:
  3000/tcp: 3000
  3001/tcp: 3001
ports_description:
  3000/tcp: "Web UI (HTTP)"
  3001/tcp: "Web UI (HTTPS)"
environment:
  START_DOCKER: "false"
  TITLE: "Ubuntu XFCE (Русский)"
  LC_ALL: "ru_RU.UTF-8"
  LANG: "ru_RU.UTF-8"
map:
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - backup:rw
  - ssl:rw
options:
  PUID: 1000
  PGID: 1000
  TZ: "Europe/Chisinau"
  LC_ALL: "ru_RU.UTF-8"
  KEYBOARD: "ru-ru-qwerty"
  DRINODE: "/dev/dri/renderD128"
  CUSTOM_USER: ""
  PASSWORD: ""
schema:
  PUID: int
  PGID: int
  TZ: str
  LC_ALL: str
  KEYBOARD: str
  DRINODE: str?
  CUSTOM_USER: str?
  PASSWORD: password?
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
  - SYS_PTRACE
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/vchiq
  - /dev/video10
  - /dev/video11
  - /dev/video12
  - /dev/video13
  - /dev/video14
  - /dev/video15
  - /dev/video16
  - /dev/ttyUSB0
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
  - /dev/sdd
  - /dev/sde
  - /dev/sdf
  - /dev/sdg
  - /dev/nvme
  - /dev/nvme0
  - /dev/nvme0n1
  - /dev/nvme0n1p1
  - /dev/nvme0n1p2
  - /dev/nvme0n1p3
  - /dev/nvme1n1
  - /dev/nvme1n1p1
  - /dev/nvme1n1p2
  - /dev/nvme1n1p3
  - /dev/nvme2n1
  - /dev/nvme2n1p1
  - /dev/nvme2n1p2
  - /dev/nvme2n3p3
  - /dev/mmcblk
  - /dev/fuse
  - /dev/sda1
  - /dev/sdb1
  - /dev/sdc1
  - /dev/sdd1
  - /dev/sde1
  - /dev/sdf1
  - /dev/sdg1
  - /dev/sda2
  - /dev/sdb2
  - /dev/sdc2
  - /dev/sdd2
  - /dev/sde2
  - /dev/sdf2
  - /dev/sdg2
  - /dev/sda3
  - /dev/sdb3
  - /dev/sda4
  - /dev/sdb4
  - /dev/sda5
  - /dev/sda6
  - /dev/sda7
  - /dev/sda8
  - /dev/nvme0
  - /dev/nvme1
  - /dev/nvme2
shm_size: "1g"
