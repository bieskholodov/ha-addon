name: "Webmin"
description: "Веб-интерфейс для управления файлами, Samba, SSH и сервисами"
version: "1.2.9"
slug: "webmin"
init: false
host_network: true
ingress: true
ingress_port: 10000
panel_icon: "mdi:server-network"
panel_title: "Webmin"
full_access: true
docker_api: true
hassio_api: true
hassio_role: admin
apparmor: false
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
webui: "[PROTO:ssl]://[HOST]:[PORT:10000]"
ports:
  10000/tcp: 10000
  22/tcp: 22
ports_description:
  10000/tcp: "Веб-интерфейс Webmin"
  22/tcp: "SSH и SFTP доступ"
arch:
  - aarch64
  - amd64
  - armv7
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
options:
  password: "changeme"
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
schema:
  password: password
  ssl: bool
  certfile: str
  keyfile: str
