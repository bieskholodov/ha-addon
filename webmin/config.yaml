name: "Webmin"
description: "Веб-интерфейс для управления файлами и сервисами в контейнере"
version: "1.1.4"
slug: "webmin"
init: false
host_network: true
webui: "[PROTO:ssl]://[HOST]:[PORT:10000]"
ports:
  10000/tcp: 10000
ports_description:
  10000/tcp: "Веб-интерфейс Webmin"
arch:
  - aarch64
  - amd64
  - armv7
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
options:
  password: "changeme"
  ssl: true
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
schema:
  password: password
  ssl: bool
  certfile: str
  keyfile: str
