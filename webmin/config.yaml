name: "Webmin"
description: "Веб-интерфейс для управления файлами, Samba, SSH, FTP и NFS"
version: "2.7103"
slug: "webmin"
init: false
host_network: true
full_access: true
docker_api: true
hassio_api: true
hassio_role: admin
apparmor: false
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
webui: "[PROTO:ssl]://[HOST]:[PORT:10000]"
arch:
  - aarch64
  - amd64
  - armv7
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
options:
  password: "changeme"
  ssl: true
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
schema:
  password: password
  ssl: bool
  certfile: str
  keyfile: str
